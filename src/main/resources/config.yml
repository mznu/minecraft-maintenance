# BCP 47 language tag. Bundled languages: en, ko; for example, en-US falls back to lang/en.yml.
# User-facing text and its date display format are configured in that language file.
locale: en

# Persisted maintenance-mode state, managed by maintenance commands and schedules.
enabled: false

# Config durations use ordered whole-number d/h/m/s components without spaces, such as 1h30m or 30s.
# Schedule times use ISO-8601; local values such as 2026-09-01T02:00 use time-zone below.
# Command starts also accept now, now+<duration>, H, HH, or HH:mm; ends accept H, HH, HH:mm, or a duration.
# Command durations use positive d/h/m components only. H and HH mean HH:00.
# An earlier time-only end moves to the next local date. Command-only values are persisted as ISO-8601.
schedule:
  # Time zone used to interpret local date-times and display schedule times.
  # Accepts an IANA Time Zone Database ID (for example, Europe/London or Asia/Seoul), or UTC.
  time-zone: UTC
  # ISO-8601 schedule start time. Requires ends-at; leave both values empty for no schedule.
  starts-at: ''
  # ISO-8601 schedule end time. Must be later than starts-at and in the future; durations are not accepted here.
  ends-at: ''
  # Configures reminder broadcasts for scheduled maintenance.
  notifications:
    # Durations before starts-at when reminders are sent to online players. Leave empty to disable.
    remind-before:
      - 1h
      - 30m
      - 10m
      - 5m
      - 1m
      - 30s
      - 10s

# Customizes the multiplayer server list during or shortly before maintenance.
server-list:
  # Controls the localized MOTD shown for maintenance states.
  motd:
    # Controls the MOTD shown before scheduled maintenance starts.
    upcoming:
      # How long before starts-at to show the upcoming MOTD. Leave empty to disable.
      show-before: 1h
  # Replaces the server icon while maintenance mode is enabled.
  icon:
    # Relative to the plugin data folder. Leave empty to use the default server icon.
    # For example, "maintenance-icon.png" resolves to plugins/Maintenance/maintenance-icon.png.
    # The image must be a 64x64 PNG.
    file: ''
